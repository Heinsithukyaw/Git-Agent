name: digest

# One file, four jobs. Not one job with four steps.
#
# The split is along the privilege boundary, not the logical one (I1):
#
#   fetch      contents: read   no secrets     reads the world
#   narrate    contents: read   holds the key  writes prose to an artifact
#   commit     contents: write  NO KEY         runs the containment gate, commits
#   heartbeat  contents: write  NO KEY         runs only when fetch fails, so the
#                                              liveness signal still moves
#
# The gate landed in the job with no key on purpose. The thing that decides what
# gets written is the thing that cannot be hijacked, because it never talks to a
# model. A gate sharing a job with the model is a gate the model's input can
# influence.
#
# `heartbeat` is not a fifth stage of the pipeline; it is the branch taken when
# the pipeline produced nothing. It exists because a repository whose scheduled
# workflow commits nothing for 60 days has its schedule disabled — so a run that
# fails has to leave a mark, or the failure becomes permanent and silent.
#
# The cost is one artifact round-trip per run, measured in seconds. The benefit
# is that a successful prompt injection drops from "arbitrary commit" to "a false
# sentence in an artifact the gate then rejects".

on:
  schedule:
    # Deliberately not on the hour: GitHub delays scheduled runs under load, and
    # the top of every hour is the documented peak.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      probe_endpoint:
        description: Probe the configured endpoint and record its capabilities
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: git-agent-digest
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ read --
  fetch:
    name: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Gather
        run: node scripts/fetch-step.mjs
        env:
          # The platform token, not a credential the user configured. Its scope
          # is exactly this job's permissions, which is why it is not a secret
          # for the purposes of I1.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payload
          path: .run/payload.json
          retention-days: 1
          if-no-files-found: error

  # ------------------------------------------------------------- narrate --
  narrate:
    name: narrate
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A narration failure degrades the run to the deterministic digest. It must
    # not stop it: the rules-only path is a complete product.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload
          path: .run

      - name: Narrate
        run: node scripts/narrate-step.mjs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_USER_AGENT: ${{ vars.LLM_USER_AGENT }}
          LLM_TOKEN_BUDGET: ${{ vars.LLM_TOKEN_BUDGET }}
          JEV_ENABLED: ${{ vars.JEV_ENABLED }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_BASE_URL: ${{ vars.JEV_BASE_URL }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          AGENT_LANG: ${{ vars.AGENT_LANG || 'en' }}
          PROBE_ENDPOINT: ${{ github.event.inputs.probe_endpoint || 'false' }}

      # The whole handoff, not just the prose.
      #
      # `commit-step` reads `decisions.json` (line 78), `narration.json` (line 84)
      # and `endpoint.json` (line 179) as well as `prose.md` — and an artifact that
      # carries only one of the four delivers an empty decision set to the job that
      # writes the digest. The run then publishes "0 to act on" and still reports
      # `ok`, which is the worst available failure mode in a security product.
      #
      # `decisions.json` and `narration.json` are written before any early return,
      # so this artifact exists on every path that *returns*. It does not exist on
      # a path that *throws*: `decisions.json` is written after `readPayload()` and
      # `await triage()`, either of which can raise, and a failed step skips the
      # steps below it. `if: always()` is what keeps a partial run's decisions —
      # `probe()` throwing after the decisions were written is the case that
      # matters, and without it those decisions are lost and the commit job
      # publishes "0 to act on" again. `prose.md` and `endpoint.json` are the
      # optional two, hence `ignore`.
      #
      # I15 asserts this list covers every `.run/` file read across a step
      # boundary, so the next file added to the pipeline cannot quietly miss it.
      - name: Upload run state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-state
          path: |
            .run/prose.md
            .run/decisions.json
            .run/narration.json
            .run/endpoint.json
          retention-days: 1
          if-no-files-found: ignore

  # -------------------------------------------------------------- commit --
  commit:
    name: commit
    needs: [fetch, narrate]
    if: ${{ !cancelled() && needs.fetch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload
          path: .run

      # No `if:` guard, and deliberately tolerant.
      #
      # The guard this replaces was `needs.narrate.result == 'success'`, which is
      # the wrong signal: `narrate` sets `continue-on-error: true` and exits 0 by
      # design on the keyless path, so that condition is TRUE on exactly the runs
      # where `prose.md` may not exist. `download-artifact` has no ignore option,
      # so the pairing turned a healthy keyless run red — contradicting I9, where
      # a keyless instance is a supported, complete mode rather than a failure.
      #
      # The artifact is named after the job that produces it, so a missing one
      # means `narrate` failed outright. That is a degradation, not a reason to
      # abandon the run: the heartbeat must still move, or a broken agent commits
      # nothing and GitHub disables the schedule after 60 days.
      - name: Download run state
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: run-state
          path: .run

      # The containment gate runs here, in the job that holds no model key.
      #
      # There is deliberately no `NARRATE_RESULT` here. There was, and it was
      # `${{ needs.narrate.result }}` — which cannot be trusted: `narrate` carries
      # `continue-on-error: true`, so the platform reports `success` for a job that
      # died from an exception, and the `failed` branch it fed was unreachable.
      # `commit-step` reads `.run/narration.json` instead, which `narrate-step`
      # writes on every path including its own top-level `catch`. A signal that
      # reads as authoritative and is not is worse than no signal.
      - name: Gate and write
        run: node scripts/commit-step.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      # Bounded writes, enforced a second time against the actual working tree.
      - name: Assert nothing unexpected is dirty
        run: |
          set -euo pipefail
          node tools/check-invariants.mjs --dirty
          node tools/check-invariants.mjs --allowlist

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "git-agent[bot]"
          git config user.email "git-agent[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "digest: $(node -e "console.log(require('./data/heartbeat.json').last_status || 'run')") $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  # ----------------------------------------------------------- heartbeat --
  #
  # A run that produced nothing still has to move the liveness signal, or the
  # schedule dies with it. GitHub disables a scheduled workflow after 60 days of
  # no repository activity, so a run that commits nothing is not merely quiet —
  # it is the first step towards the failure becoming permanent and silent.
  #
  # Two ways to produce nothing, and both land here:
  #
  #   - `fetch` failed, so there is no payload and `commit` was skipped;
  #   - `commit` ran and did not succeed — most importantly when the narrate
  #     stage delivered nothing, in which case `commit-step` deliberately
  #     publishes nothing rather than a digest whose counts it cannot
  #     substantiate.
  #
  # `commit` is in `needs` and the condition reads its result, which is safe:
  # `commit` does NOT carry `continue-on-error`, so `needs.commit.result` means
  # what it says. `narrate` does carry it, which is why its result is read
  # nowhere.
  #
  # This job holds `contents: write` and no secret, like every other writing job
  # (I1), and it writes only the heartbeat, the run log and the README region,
  # all inside the collector allowlist (I3).
  heartbeat:
    name: heartbeat
    needs: [fetch, narrate, commit]
    if: ${{ always() && (needs.fetch.result != 'success' || needs.commit.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Record the failure
        run: node scripts/heartbeat-step.mjs
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEARTBEAT_STATUS: failed
          # The reason is built from these in `heartbeat-step.mjs` rather than
          # from an expression here, so the wording lives with the code that
          # writes it and a new cause cannot silently reuse another one's text.
          FETCH_RESULT: ${{ needs.fetch.result }}
          COMMIT_RESULT: ${{ needs.commit.result }}

      - name: Assert nothing unexpected is dirty
        run: |
          set -euo pipefail
          node tools/check-invariants.mjs --dirty

      - name: Commit the liveness signal
        run: |
          set -euo pipefail
          git config user.name  "git-agent[bot]"
          git config user.email "git-agent[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "heartbeat: failed run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
