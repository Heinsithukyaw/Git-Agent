name: act

# The only workflow that may open a pull request.
#
# Split from `ask.yml` deliberately: `ask` answers lookups and can never change
# the user's code. `act` requires an explicit verb — `bump` or `verify` — and it
# is never reachable from the cron. Reporting goes to `main`; execution goes to
# an `agent/*` branch and then a pull request, so a bad bump is one closed PR
# rather than a commit in the middle of an append-only history.
#
# No secrets anywhere in this workflow. It writes, so it must not hold a key.

on:
  issue_comment:
    types: [created]
  # Same second shape as `ask`: a freshly opened issue whose title begins with
  # `/agent ` — prefix and space, the shape the composer and the template emit —
  # is a command. It matters more here than there, because this is the workflow
  # that can open a pull request — which is why the author gate still runs first,
  # inside the job, before anything is computed or written.
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: git-agent-act-${{ github.event_name == 'issues' && github.event.issue.number || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ plan --
  plan:
    name: plan
    # Same shape as `ask.yml`, and it matters more here: this is the workflow
    # that can open a pull request. The guard is a pre-filter over an event; the
    # real gate is the author check inside `scripts/act-step.mjs`, which still
    # exits. I13 asserts both name the same allowlist.
    #
    # The association is read per event on purpose — `github.event.comment` is
    # null on an `issues` event, and `null != 'NONE'` is true, so a single
    # condition would admit a stranger's issue by accident.
    if: |
      github.event.issue.pull_request == null
      && (
        (github.event_name == 'issue_comment'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
        || (github.event_name == 'issues'
          && startsWith(github.event.issue.title, '/agent ')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      verb: ${{ steps.plan.outputs.verb }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      branch: ${{ steps.plan.outputs.branch }}
      patch_b64: ${{ steps.plan.outputs.patch_b64 }}
      command_b64: ${{ steps.plan.outputs.command_b64 }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Author gate and grammar first. A stranger commenting `/agent bump ...`
      # fails here, in a job that holds no key and has not written anything.
      - name: Validate and compute the change
        id: plan
        run: node scripts/act-step.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.comment.body }}
          COMMENT_ID: ${{ github.event_name == 'issues' && format('issue:{0}', github.event.issue.number) || github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event_name == 'issues' && github.event.issue.user.login || github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event_name == 'issues' && github.event.issue.author_association || github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SANDBOX_ENABLED: ${{ vars.SANDBOX_ENABLED || 'false' }}

      # Same guard as `digest.yml`, and the same reasoning as in `ask.yml`: this
      # job stages with `git add -A`, so the allowlist has to be asserted against
      # the working tree rather than trusted to the writers' good behaviour.
      - name: Assert nothing unexpected is dirty
        run: node tools/check-invariants.mjs --dirty

      - name: Commit the intent row
        run: |
          set -euo pipefail
          git config user.name  "git-agent[bot]"
          git config user.email "git-agent[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git add -A
          git commit -m "act: recorded /agent ${{ steps.plan.outputs.verb }} ${{ steps.plan.outputs.package }}"
          git push

      # The plan crosses a job boundary, so it has to travel as an artifact.
      # `pr-step` reads `.run/act.json` for the patch and the verify command; with
      # nothing carrying it the file is simply absent in the next job, `plan`
      # resolves to null, and the fallbacks at `pr-step.mjs:73-74` quietly produce
      # a pull request with an EMPTY patch and the default command — a write verb
      # that reports success and changes nothing.
      #
      # `error`, not `ignore`: `act.json` is written at `act-step.mjs:202`, after
      # every validation path has returned, and `verb` is set immediately after at
      # `:208`. So `verb != ''` — the condition this job's dependants are gated on
      # — is exactly "the plan exists". A missing plan here is a defect, not an
      # optional input.
      - name: Upload the plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: act-plan
          path: .run/act.json
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------- sandbox --
  sandbox:
    name: sandbox
    needs: plan
    if: ${{ needs.plan.outputs.verb != '' && needs.plan.outputs.sandbox == 'true' }}
    # Shape B: a fixed pipeline — apply, run, report. The loop stays in the
    # job that owns the decision; this job only executes and answers.
    uses: ./.github/workflows/sandbox.yml
    with:
      patch_b64: ${{ needs.plan.outputs.patch_b64 }}
      command_b64: ${{ needs.plan.outputs.command_b64 }}
      network: none

  # -------------------------------------------------------------------- pr --
  pull-request:
    name: pull-request
    needs: [plan, sandbox]
    if: ${{ always() && needs.plan.outputs.verb != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # No guard and no tolerance: this job runs only when `plan` produced a verb,
      # which is exactly when `.run/act.json` exists (see the upload note above).
      # An artifact that fails to arrive must fail the job — an empty patch
      # reaching `pr-step` opens a pull request that claims a change it does not
      # make, which is the one outcome worse than no pull request at all.
      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: act-plan
          path: .run

      - name: Open the pull request
        run: node scripts/pr-step.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERB: ${{ needs.plan.outputs.verb }}
          PACKAGE: ${{ needs.plan.outputs.package }}
          VERSION: ${{ needs.plan.outputs.version }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          COMMENT_ID: ${{ github.event_name == 'issues' && format('issue:{0}', github.event.issue.number) || github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
          SANDBOX_EXIT: ${{ needs.sandbox.outputs.exit_code }}
          SANDBOX_LOG: ${{ needs.sandbox.outputs.log_tail }}
