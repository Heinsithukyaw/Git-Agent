name: pages

# Publishes site/ — the digest view and the chat composer.
#
# Triggered by the digest run completing, not by push, so the site is published
# once per digest rather than once per commit. GitHub never renders an .html file
# from a repository blob: the blob shows source and raw.githubusercontent serves
# text/plain, so Pages is the only supported route to a rendered page.
#
# Opt-in in practice: if Pages is not enabled on the repository this workflow
# fails loudly on the deploy step and nothing else is affected.

on:
  workflow_run:
    workflows: [digest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-agent-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Render
        run: node scripts/render-site.mjs

      # The pages have just been rendered, so this is the only moment at which
      # the check that scans them reads the bytes about to be uploaded rather
      # than the committed copy. I10 fails closed when it finds no page, so
      # dropping the render step fails the deploy here instead of passing
      # quietly on the way to publishing an unscanned site.
      - name: Invariants
        run: node tools/check-invariants.mjs

      - name: Upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Pages publishes the site, not the repository's visibility. A Pages site
      # built from a **private** repository is still readable by anyone on the
      # internet — access-controlled Pages needs GitHub Enterprise Cloud, and only
      # for organisation-owned project sites. So on Pro/Team, or a personal
      # account, enabling this workflow publishes the digest, and the digest names
      # the packages watched.
      #
      # It warns, and does not fail. Publishing a digest you are willing to
      # publish is a legitimate choice, and README § "Where it runs" already tells
      # an operator whose stack must stay private not to enable this file at all;
      # a gate here would refuse a valid configuration rather than inform it. It
      # sits in the deploy job because that is the job that publishes, and a
      # caveat belongs beside the act it qualifies.
      - name: Warn — a private repository does not make a private site
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          # `visibility` is the field we want; `private` is the older boolean and
          # is the fallback. If neither is present — a payload shape we did not
          # expect — that reads as `unknown` rather than `public`, because a
          # check that cannot tell must never report that all is well.
          visibility="${VISIBILITY:-}"
          if [ -z "$visibility" ]; then
            case "${IS_PRIVATE:-}" in
              true)  visibility=private ;;
              false) visibility=public  ;;
              *)     visibility=unknown ;;
            esac
          fi

          if [ "$visibility" = "public" ]; then
            echo "This repository is public. The caveat does not apply — the"
            echo "repository is already the wider disclosure, with Pages off."
            exit 0
          fi

          echo "::warning::This repository is ${visibility}, but the Pages site it is about to publish is world-readable."

          # The annotation is dismissed with the run; the summary is still on the
          # run page when someone audits it months later. Falling back to
          # /dev/null keeps this step runnable under `act`, which does not set
          # GITHUB_STEP_SUMMARY — the annotation is the part that must not degrade.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          printf '\n## Pages publishes the site, not the repository visibility\n\n' >> "$summary"
          printf 'This repository is **%s**. The site this job is publishing is **readable by anyone on the internet** — access-controlled Pages needs GitHub Enterprise Cloud, and only for organisation-owned project sites.\n\n' "$visibility" >> "$summary"
          cat >> "$summary" <<'SUMMARY'
          What the site serves:

          | File | What it discloses |
          |---|---|
          | `digest/public-<date>.md` | the digest, narration included |
          | `data/public-summary.json` | the counts, including `packages watched` |

          The digest names the packages you watch. If your stack must stay private,
          disable this workflow (`.github/workflows/pages.yml`).

          See README § *Pages publishes the site, not the repository's visibility*.
          SUMMARY

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
