name: pages

# Publishes site/ — the digest view and the chat composer.
#
# Triggered by the digest run completing, not by push, so the site is published
# once per digest rather than once per commit. GitHub never renders an .html file
# from a repository blob: the blob shows source and raw.githubusercontent serves
# text/plain, so Pages is the only supported route to a rendered page.
#
# Opt-in in practice: if Pages is not enabled on the repository this workflow
# fails loudly on the deploy step and nothing else is affected.

on:
  workflow_run:
    workflows: [digest]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-agent-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Render
        run: node scripts/render-site.mjs

      # The pages have just been rendered, so this is the only moment at which
      # the check that scans them reads the bytes about to be uploaded rather
      # than the committed copy. I10 fails closed when it finds no page, so
      # dropping the render step fails the deploy here instead of passing
      # quietly on the way to publishing an unscanned site.
      - name: Invariants
        run: node tools/check-invariants.mjs

      - name: Upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
