<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 56" width="480" height="56" role="img" aria-labelledby="badgeTitleDark">
  <!--
    Git Agent — README CI badge (dark). Twin of badge.svg; same geometry, same
    claim, dark palette from site/index.html (:root).

    See badge.svg for why this reads "enforced by a check" rather than "passing".
  -->
  <title id="badgeTitleDark">Continuous integration: every rule is enforced by a check, or it is not a rule. Follow the link to see the current runs.</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .card { fill: #131a22; stroke: #232a33; stroke-width: 1; }
    .pill { fill: #58a6ff; }
    .pilltx { fill: #0b0f14; }
    .ink { fill: #e6edf3; }
    .muted { fill: #9aa7b4; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="479" height="55" rx="8"/>

  <rect class="pill" x="12" y="12" width="52" height="32" rx="6"/>
  <text class="mono pilltx" x="38" y="28" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central">ci</text>

  <text class="sans ink" x="76" y="28" font-size="14" dominant-baseline="central">every rule is enforced by a check</text>
  <text class="sans muted" x="468" y="28" font-size="13" text-anchor="end" dominant-baseline="central">view the runs &#8594;</text>
</svg>
