<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 212" width="1200" height="212" role="img" aria-labelledby="fwTitleD fwDescD">
  <!--
    Git Agent — the fork warning (dark).

    Geometry is identical to fork-warning.svg; only the palette differs, so the
    two twins cannot drift in layout. Keep them in step by editing both, or by
    editing this file's palette only.
  -->
  <title id="fwTitleD">A fork of this public repository can never be made private</title>
  <desc id="fwDescD">A fork of this public repository can never be made private. The upstream maintainer can read every fork in the network, and deleting the fork does not retract the commits — they stay reachable from the upstream.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .panel { fill: #131a22; stroke: #232a33; stroke-width: 1; }
    .band {
      fill: #58a6ff; opacity: .10;
      transform-box: fill-box; transform-origin: left center;
      animation: sweep .9s cubic-bezier(.2,.7,.3,1) both .15s;
    }
    .bar { fill: #58a6ff; animation: breathe 4.2s ease-in-out infinite; }
    .eyebrow { fill: #58a6ff; font-size: 14px; letter-spacing: 2.4px; }
    .head { fill: #e6edf3; font-size: 26px; font-weight: 600; }
    .em { fill: #58a6ff; }
    .fact { fill: #9aa7b4; font-size: 16px; }
    .dot { fill: #58a6ff; }
    .r1 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .05s; }
    .r2 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .24s; }
    .r3 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .44s; }
    .r4 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .58s; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .band, .bar, .r1, .r2, .r3, .r4 { animation: none; }
    }
  </style>
  <rect class="panel" x="48" y="24" width="1104" height="164" rx="14"/>
  <rect class="band" x="72" y="76" width="1056" height="36" rx="6"/>
  <rect class="bar" x="60" y="46" width="4" height="124" rx="2"/>
  <text class="sans eyebrow r1" x="84" y="58">BEFORE YOU FORK</text>
  <text class="sans head r2" x="84" y="102">A fork of this public repository can <tspan class="em">never</tspan> be made private.</text>
  <circle class="dot r3" cx="88" cy="141" r="3.5"/>
  <text class="sans fact r3" x="106" y="146">The upstream maintainer can read every fork in the network.</text>
  <circle class="dot r4" cx="88" cy="171" r="3.5"/>
  <text class="sans fact r4" x="106" y="176">Deleting the fork does not retract the commits — they stay reachable upstream.</text>
</svg>
