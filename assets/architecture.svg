  <text class="mono chipname ink" x="508" y="617">digest/</text>
  <text class="sans chipsub muted" x="508" y="633">dated archive</text>

  <rect class="chip" x="700" y="598" width="196" height="42" rx="8"/>
  <text class="mono chipname ink" x="716" y="617">site/</text>
