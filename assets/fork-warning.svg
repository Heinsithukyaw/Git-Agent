<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 212" width="1200" height="212" role="img" aria-labelledby="fwTitle fwDesc">
  <!--
    Git Agent — the fork warning (light).

    The dark twin is fork-warning-dark.svg, and the palette is the one in
    site/index.html (:root), so the artwork and the Pages site are visibly the
    same product. Artwork is #0b62d6; the site's dark/gold pair is separate on
    purpose and neither borrows from the other.

    No external references and no JavaScript: this file has to render inside an
    <img>, where nothing runs but CSS. Every animation is therefore CSS on
    presentation attributes, and the reveal is additive — with motion off, every
    line is fully drawn and the band is full width. That is the same rule the
    hero follows, for the same reason: a reader who has asked their system not to
    animate things must still get the warning.

    The band is deliberately full-width rather than fitted to the headline. A
    fitted highlight has to guess at font metrics, and it looks like a mistake
    when the guess is short or long; a banded row is a decision.
  -->
  <title id="fwTitle">A fork of this public repository can never be made private</title>
  <desc id="fwDesc">A fork of this public repository can never be made private. The upstream maintainer can read every fork in the network, and deleting the fork does not retract the commits — they stay reachable from the upstream.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .panel { fill: #f7f9fb; stroke: #e3e7ec; stroke-width: 1; }
    .band {
      fill: #0b62d6; opacity: .07;
      transform-box: fill-box; transform-origin: left center;
      animation: sweep .9s cubic-bezier(.2,.7,.3,1) both .15s;
    }
    .bar { fill: #0b62d6; animation: breathe 4.2s ease-in-out infinite; }
    .eyebrow { fill: #0b62d6; font-size: 14px; letter-spacing: 2.4px; }
    .head { fill: #14181f; font-size: 26px; font-weight: 600; }
    .em { fill: #0b62d6; }
    .fact { fill: #5b6675; font-size: 16px; }
    .dot { fill: #0b62d6; }
    .r1 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .05s; }
    .r2 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .24s; }
    .r3 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .44s; }
    .r4 { animation: rise .5s cubic-bezier(.2,.7,.3,1) both .58s; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .band, .bar, .r1, .r2, .r3, .r4 { animation: none; }
    }
  </style>
  <rect class="panel" x="48" y="24" width="1104" height="164" rx="14"/>
  <rect class="band" x="72" y="76" width="1056" height="36" rx="6"/>
  <rect class="bar" x="60" y="46" width="4" height="124" rx="2"/>
  <text class="sans eyebrow r1" x="84" y="58">BEFORE YOU FORK</text>
  <text class="sans head r2" x="84" y="102">A fork of this public repository can <tspan class="em">never</tspan> be made private.</text>
  <circle class="dot r3" cx="88" cy="141" r="3.5"/>
  <text class="sans fact r3" x="106" y="146">The upstream maintainer can read every fork in the network.</text>
  <circle class="dot r4" cx="88" cy="171" r="3.5"/>
  <text class="sans fact r4" x="106" y="176">Deleting the fork does not retract the commits — they stay reachable upstream.</text>
</svg>
